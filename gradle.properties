kotlin.code.style=official
org.gradle.configuration-cache=true

# Signing
signing.secretKeyRingFile=~/.gnupg/secring.gpg

# Compile inside the personal executor rather than leaving a Kotlin daemon.
org.gradle.jvmargs=-Xmx1G -XX:MaxMetaspaceSize=512m -XX:ActiveProcessorCount=2
kotlin.compiler.execution.strategy=in-process
org.gradle.java.installations.auto-download=false

# list of nms
subprojects.reobfnms=v1_21R1,v1_21R2,v1_21R3,v1_21R4,v1_21R5,v1_21R6,v1_21R7

# list of version for hangar release
paperVersion=1.18-26.3

